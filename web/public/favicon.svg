  <path d="M21 16h30M21 21h30M21 26h22" stroke="#c0392b" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Box -->
  <rect x="5" y="30" width="54" height="29" rx="4" fill="#b8692e" stroke="#3b2a1a" stroke-width="2"/>
  <rect x="4" y="27" width="56" height="8" rx="3" fill="#8b4a1d" stroke="#3b2a1a" stroke-width="2"/>
