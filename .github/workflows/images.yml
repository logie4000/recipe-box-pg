name: Images

# Builds the production images (the four services plus the web build) and pushes them to ECR, tagged with the
# commit SHA and "latest", after CI passes on main (or by hand from the
# Actions tab). Deploy one with: IMAGE_TAG=<sha> deploy/scripts/deploy.sh
#
# Setup (docs/ecr.md): an AWS role GitHub can assume, and these repository
# variables (Settings > Secrets and variables > Actions > Variables):
#   AWS_ROLE_ARN           the role, e.g. arn:aws:iam::123456789012:role/recipe-box-github
#   AWS_REGION             e.g. us-east-1
#   COMPOSE_PROJECT_NAME   same as in SSM, e.g. recipe-box (repos are <name>-write-api, ...)

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: images
  cancel-in-progress: false

permissions:
  id-token: write   # sign in to AWS with GitHub's OIDC token, no stored keys
  contents: read

jobs:
  push:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: write-api
            context: write-api
          - name: read-api
            context: server
          - name: keycloak
            context: deploy/keycloak
          - name: backup
            context: deploy/backup
          - name: web # the Angular build; deploy.sh copies it to the web root
            context: web
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      REPO: ${{ vars.COMPOSE_PROJECT_NAME }}-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create the ECR repository on first use
        run: |
          aws ecr describe-repositories --repository-names "$REPO" >/dev/null 2>&1 ||
            aws ecr create-repository --repository-name "$REPO" \
              --image-scanning-configuration scanOnPush=true >/dev/null

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          build-args: APP_VERSION=${{ env.SHA }}
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.REPO }}:${{ env.SHA }}
            ${{ steps.ecr.outputs.registry }}/${{ env.REPO }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Summary
        run: echo "Pushed \`$REPO:$SHA\`" >> "$GITHUB_STEP_SUMMARY"
