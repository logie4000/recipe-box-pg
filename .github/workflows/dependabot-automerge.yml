name: Dependabot auto-merge

# Turns on auto-merge (squash) for Dependabot PRs that only carry patch or
# minor updates. GitHub then merges the PR by itself once every required
# status check passes (and any required review is in). Majors are left alone.
#
# Needs these repository settings (see docs/dependabot.md):
#   - General > Pull Requests > "Allow auto-merge"
#   - the "Protect default branch" ruleset requiring the three CI checks,
#     otherwise auto-merge would merge before CI finishes

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'logie4000/recipe-box-pg'
    runs-on: ubuntu-24.04
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for patch and minor updates
        if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
