# Dependabot version updates. Patch and minor updates are grouped into one PR
# per ecosystem and auto-merged once CI passes (.github/workflows/dependabot-automerge.yml);
# major updates open their own PRs and wait for a human.
#
# Not covered (Dependabot can't follow these, bump them by hand):
#   - images pinned through ARG (ruby in write-api, keycloak, postgres) and the
#     ${VAR}-interpolated images in deploy/docker-compose*.yml
#   - Ruby itself (.ruby-version) and the Go version in server/go.mod
version: 2

updates:
  - package-ecosystem: bundler
    directory: /write-api
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    groups:
      bundler-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /server
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    groups:
      gomod-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    # Angular majors need `ng update` (code migrations, and a TypeScript version
    # pinned by Angular), which Dependabot can't do: its PRs for these fail to
    # install. Upgrade them by hand with ng update twice a year instead.
    ignore:
      - dependency-name: "@angular/*"
        update-types: [version-update:semver-major]
      - dependency-name: "@angular-devkit/*"
        update-types: [version-update:semver-major]
      - dependency-name: "angular-eslint"
        update-types: [version-update:semver-major]
      - dependency-name: "@angular-eslint/*"
        update-types: [version-update:semver-major]
      - dependency-name: "typescript"
        update-types: [version-update:semver-major, version-update:semver-minor]

  - package-ecosystem: docker
    directories: [/server, /web, /write-api, /deploy/keycloak, /deploy/backup]
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    groups:
      docker-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
