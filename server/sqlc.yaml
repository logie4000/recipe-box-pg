# sqlc reads the schema Rails dumps after every migration. Run `make gen`
# (or `sqlc generate` from this directory) after `make migrate`.
version: "2"
sql:
  - engine: postgresql
    schema: ../write-api/db/structure.sql
    queries: queries
    gen:
      go:
        package: sqlc
        out: internal/db/sqlc
        sql_package: pgx/v5
        emit_json_tags: true
        emit_empty_slices: true
        omit_unused_structs: true
        overrides:
          - db_type: pg_catalog.timestamp
            go_type: time.Time
          - db_type: pg_catalog.timestamptz
            go_type: time.Time
