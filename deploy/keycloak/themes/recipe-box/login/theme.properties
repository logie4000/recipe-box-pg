# Recipe Box sign-in pages: Keycloak's own (keycloak.v2) with the app's look.
# Only styles, the icon and a few messages change; every page template is
# Keycloak's, so upgrades keep working.
parent=keycloak.v2
import=common/keycloak

# keycloak.v2's stylesheet first, then ours on top.
styles=css/styles.css css/recipe-box.css

# The app is light only.
darkMode=false
